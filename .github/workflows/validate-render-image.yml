name: Validate Render production image

on:
  pull_request:
    branches:
      - architecture/foundation-plan
    paths:
      - '.github/workflows/validate-render-image.yml'
      - 'docs/deployment/hybrid-render-vercel-plan.md'
      - 'packages/twenty-docker/twenty/Dockerfile.render'
      - 'packages/twenty-docker/twenty/entrypoint.sh'
      - 'packages/twenty-server/**'
      - 'packages/twenty-shared/**'
      - 'packages/twenty-emails/**'
      - 'packages/twenty-client-sdk/**'
      - 'packages/twenty-oxlint-rules/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.yarn/**'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.dockerignore'
  push:
    branches:
      - infra/render-hybrid-plan
    paths:
      - '.github/workflows/validate-render-image.yml'
      - 'docs/deployment/hybrid-render-vercel-plan.md'
      - 'packages/twenty-docker/twenty/Dockerfile.render'
      - 'packages/twenty-docker/twenty/entrypoint.sh'
      - 'packages/twenty-server/**'
      - 'packages/twenty-shared/**'
      - 'packages/twenty-emails/**'
      - 'packages/twenty-client-sdk/**'
      - 'packages/twenty-oxlint-rules/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.yarn/**'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      app_version:
        description: Optional application version label
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: render-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server-image:
    name: Build explicit production server target
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build production API/worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile.render
          target: twenty-server-production
          push: false
          load: true
          tags: twenty-crm-reb:render-validation
          build-args: |
            APP_VERSION=${{ inputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API and worker runtime outputs
        run: |
          docker image inspect twenty-crm-reb:render-validation >/dev/null
          docker run --rm --entrypoint sh twenty-crm-reb:render-validation -c 'test -x /app/entrypoint.sh && test -f /app/packages/twenty-server/dist/main.js && test -f /app/packages/twenty-server/dist/queue-worker/queue-worker.js && test -f /app/packages/twenty-server/package.json'
