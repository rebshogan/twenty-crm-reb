name: Twenty production image spike

on:
  push:
    branches:
      - architecture/foundation-plan
    paths:
      - "packages/twenty-docker/twenty/Dockerfile"
      - "packages/twenty-docker/twenty/entrypoint.sh"
      - "packages/twenty-docker/docker-compose.smoke.yml"
      - "packages/twenty-server/**"
      - "packages/twenty-front/**"
      - "packages/twenty-shared/**"
      - "packages/twenty-emails/**"
      - "packages/twenty-client-sdk/**"
      - "packages/twenty-ui/**"
      - "packages/twenty-sdk/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/**"
      - "nx.json"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/twenty-production-image-spike.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: twenty-production-image-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-production-image:
    name: Build Vercel-default Twenty production target
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (no push)
        env:
          IMAGE_TAG: twenty-crm-spike:${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --progress=plain \
            --file packages/twenty-docker/twenty/Dockerfile \
            --tag "$IMAGE_TAG" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .

          docker image inspect "$IMAGE_TAG" \
            --format 'image={{.RepoTags}} size_bytes={{.Size}} architecture={{.Architecture}}'

      - name: Verify the Dockerfile default is the production runtime
        env:
          IMAGE_TAG: twenty-crm-spike:${{ github.sha }}
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_TAG" \
            --format 'entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} workdir={{.Config.WorkingDir}} exposed={{json .Config.ExposedPorts}}'
          docker image inspect "$IMAGE_TAG" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'NODE_ENV=production'
          docker image inspect "$IMAGE_TAG" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'NODE_PORT=3000'
          docker image inspect "$IMAGE_TAG" --format '{{.Config.WorkingDir}}' | grep -Fx '/app/packages/twenty-server'
          docker image inspect "$IMAGE_TAG" --format '{{json .Config.Entrypoint}}' | grep -F '"/app/entrypoint.sh"'
          docker image inspect "$IMAGE_TAG" --format '{{json .Config.Cmd}}' | grep -F 'node'
          docker run --rm --entrypoint node "$IMAGE_TAG" --version
          docker run --rm --entrypoint yarn "$IMAGE_TAG" --version

      - name: Smoke test HTTP server and BullMQ worker
        env:
          TWENTY_IMAGE: twenty-crm-spike:${{ github.sha }}
        run: |
          set -euo pipefail
          COMPOSE_FILE=packages/twenty-docker/docker-compose.smoke.yml

          cleanup() {
            docker compose -f "$COMPOSE_FILE" logs --no-color --tail=120 server worker || true
            docker compose -f "$COMPOSE_FILE" down --volumes --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose -f "$COMPOSE_FILE" up --detach --wait --wait-timeout 900

          curl --fail --silent --show-error http://localhost:3000/healthz
          curl --fail --silent --show-error --location http://localhost:3000/ \
            --output "$RUNNER_TEMP/twenty-index.html"
          grep -Eiq '<!doctype html|<html' "$RUNNER_TEMP/twenty-index.html"

          docker compose -f "$COMPOSE_FILE" exec --no-TTY worker \
            sh -lc 'ps | grep -F "dist/queue-worker/queue-worker" | grep -v grep'
